  <!-- ====== EDITOR TABS ====== -->
  <nav class="editor-tabs" role="tablist" aria-label="Resume language views">
    <button class="tab" role="tab" data-lang="yaml" aria-selected="true">
      <span class="tab-icon">⚙️</span>
      <span class="tab-filename">gilbert.mcp.yml</span>
      <span class="tab-dot"></span>
    </button>
    <button class="tab" role="tab" data-lang="python">
      <span class="tab-icon">🐍</span>
      <span class="tab-filename">gilbert.py</span>
    </button>
    <button class="tab" role="tab" data-lang="java">
      <span class="tab-icon">☕</span>
      <span class="tab-filename">Gilbert.java</span>
    </button>
    <button class="tab" role="tab" data-lang="csharp">
      <span class="tab-icon">🟣</span>
      <span class="tab-filename">Gilbert.cs</span>
    </button>
    <button class="tab" role="tab" data-lang="typescript">
      <span class="tab-icon">🔷</span>
      <span class="tab-filename">gilbert.ts</span>
    </button>
    <button class="tab" role="tab" data-lang="markdown">
      <span class="tab-icon">📄</span>
      <span class="tab-filename">README.md</span>
    </button>
    <button class="tab tab--terminal" role="tab" data-lang="terminal">
      <span class="tab-icon">▶</span>
      <span class="tab-filename">Terminal</span>
    </button>
  </nav>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="editor-content">
    <!-- Code views get injected here by app.js -->
    <div id="code-view" class="code-panel">
      <div class="code-toolbar">
        <span class="code-lang-label" id="code-lang-label">YAML</span>
        <button class="copy-btn" id="copy-btn" title="Copy to clipboard">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <span>Copy</span>
        </button>
      </div>
      <pre class="line-numbers"><code id="code-output" class="language-yaml"></code></pre>
    </div>

    <!-- Terminal view (hidden by default) -->
    <div id="terminal-view" class="terminal-panel" style="display:none;">
      <div id="terminal-container"></div>
    </div>
  </main>
